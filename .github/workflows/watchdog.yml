# Line Drift external watchdog.
#
# Why this exists: every alarm the tool can raise is sent BY the laptop. When
# the laptop is asleep, off, or its scheduled tasks are wedged, it cannot tell
# anyone - which is exactly when you most need to be told. Claude's cloud
# cannot reach api.telegram.org either (the egress proxy returns 403).
#
# GitHub Actions runs on GitHub's machines with open egress, so it can read the
# beacon the laptop publishes and text you when that beacon goes stale. It is
# the only link in the chain that does not depend on the thing being monitored.
name: Line Drift watchdog

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Send a test Telegram even if nothing is wrong'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the beacon and text Tyler if it is bad
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST: ${{ inputs.test }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, urllib.parse, urllib.request
          import datetime as dt

          ROOT = pathlib.Path(".")
          STATE = ROOT / ".watchdog_state.json"
          now = dt.datetime.now(dt.timezone.utc)

          # Pacific without pytz: PDT is UTC-7 roughly Mar-Nov, PST UTC-8.
          # Being an hour off only shifts the window edge, never the alarm.
          pac = now - dt.timedelta(hours=7)
          in_window = ((pac.weekday() == 4 and pac.hour >= 15)   # Fri 3pm on
                       or pac.weekday() == 5)                     # all Saturday
          bar = 45 if in_window else 240                          # minutes

          problems, age = [], None
          try:
              b = json.loads((ROOT / "beacon.json").read_text())
              written = dt.datetime.fromisoformat(b["written"].replace("Z", "+00:00"))
              age = (now - written).total_seconds() / 60
              if age > bar:
                  problems.append(
                      f"The laptop has not checked in for {age/60:.1f} hours "
                      f"(limit right now is {bar/60:.1f}h). Nothing is running.")
              problems += list(b.get("problems") or [])
              if b.get("on_ac") is False:
                  problems.append("It is running on BATTERY.")
          except Exception as e:
              problems.append(f"Could not even read the beacon file: {e}")

          # A green run proves the workflow executes. It does NOT prove the
          # Telegram credentials work, because a healthy beacon never sends.
          # The test toggle forces one message so the whole chain is provable
          # without waiting for a real outage.
          test = os.environ.get("TEST", "false").strip().lower() == "true"
          test_only = False
          if not problems:
              if not test:
                  print("healthy"); raise SystemExit
              problems = ["TEST"]
          test_only = (problems == ["TEST"])

          # Strip the numbers before comparing. "down 1.5 hours" and "down 2.0
          # hours" are the same outage - comparing them raw re-sent the alarm on
          # every 30-minute run. Re-alert sooner inside the window, where an
          # outage costs money, than midweek.
          sig = "|".join(sorted(re.sub(r"\d+(?:\.\d+)?", "#", p) for p in problems))
          repeat_h = 2 if in_window else 6
          try:
              old = json.loads(STATE.read_text())
              same = old.get("sig") == sig
              since = (now - dt.datetime.fromisoformat(old["at"])).total_seconds() / 3600
              if same and since < repeat_h and not test_only:
                  print(f"same problem, told him {since:.1f}h ago - staying quiet")
                  raise SystemExit
          except SystemExit:
              raise
          except Exception:
              pass

          # Match the instructions to what is actually wrong. The old message
          # told him to plug in and open the lid for every problem - including
          # an empty entry on a laptop that was already plugged in and open.
          FIXBAT = r"C:\Users\tturk\Downloads\line-drift\scripts\FIX.bat"
          def kinds(p):
              q = p.lower(); k = set()
              if "has not checked in" in q or "could not even read" in q:
                  k |= {"down", "power", "fix"}
              if "battery" in q:
                  k |= {"power"}
              if any(w in q for w in ("sign in", "splash login",
                                      "picksheet last read", "splash session")):
                  k |= {"down", "fix"}
              if any(w in q for w in ("not finishing", "never finished", "has not run",
                                      "missing", "disabled", "no heartbeat",
                                      "cannot read saved state")):
                  k |= {"down", "fix"}
              if "entry" in q and "picks" in q:
                  k |= {"run"}
              return k or {"down", "fix"}          # unrecognised: assume the worst
          need = set().union(*(kinds(p) for p in problems))

          if test_only:
              body = ["<b>WATCHDOG TEST - nothing is wrong</b>", "",
                      "This proves alerts reach your phone with your laptop "
                      "uninvolved. If Line Drift ever actually goes down, you will "
                      "get a message headed LINE DRIFT IS DOWN with the steps to "
                      "fix it."]
          else:
              head = "LINE DRIFT IS DOWN" if "down" in need else "LINE DRIFT NEEDS YOU"
              body = [f"<b>{head}</b>", ""] + [f"- {p}" for p in problems]
              steps = []
              if "power" in need:
                  steps.append("Plug the laptop in and open the lid.")
              if "fix" in need:
                  steps.append(f"Run <code>{FIXBAT}</code>")
                  steps.append("In the Chrome window it opens, make sure you are "
                               "signed in to Splash, then CLOSE that window.")
              if "run" in need:
                  steps.append(("Then text" if "fix" in need else "Text")
                               + " <b>RUN</b> to the bot - it fills your entry "
                               "and tells you what it picked.")
              body += ["", "<b>Do this:</b>"]
              body += [f"{i}. {t}" for i, t in enumerate(steps, 1)]
              if "down" in need:
                  body += ["", "Your picks are not being changed while this is broken."]
          text = "\n".join(body)

          tok, chat = os.environ["TG_TOKEN"], os.environ["TG_CHAT"]
          data = urllib.parse.urlencode(
              {"chat_id": chat, "text": text, "parse_mode": "HTML"}).encode()
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{tok}/sendMessage", data=data)
          with urllib.request.urlopen(req, timeout=30) as r:
              print("telegram:", r.status)

          # A test must never write the dedupe marker: that would silence the
          # next real alarm for six hours.
          if not test:
              STATE.write_text(json.dumps({"sig": sig, "at": now.isoformat()}, indent=1))
          print("alerted (test)" if test else "alerted")
          PY

      - name: Remember what we said, so it is not repeated every 30 minutes
        run: |
          if [ -n "$(git status --porcelain .watchdog_state.json)" ]; then
            git config user.name  "line-drift-watchdog"
            git config user.email "watchdog@users.noreply.github.com"
            git add .watchdog_state.json
            git commit -m "watchdog: record alert state"
            git push
          fi
